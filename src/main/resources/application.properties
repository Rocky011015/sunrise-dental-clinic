spring.application.name=sunrise-dental-clinic

# MySQL connection - environment variables can override local development values
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sunrise_dental_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Colombo

# Flyway version-controlled migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true

# Development settings
spring.thymeleaf.cache=false
server.port=${PORT:8080}
server.error.include-message=always

# Administrator bootstrap configuration
# The password comes from an environment variable and is not stored in Git.
app.bootstrap.admin.username=${ADMIN_USERNAME:admin}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}
app.bootstrap.admin.full-name=${ADMIN_FULL_NAME:Clinic Administrator}