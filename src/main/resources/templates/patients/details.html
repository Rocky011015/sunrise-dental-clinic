<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Details | Sunrise Dental Clinic</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="patient-page">
<main class="page-shell">

  <section class="page-header">
    <div>
      <p class="eyebrow">Patient Management</p>
      <h1>Patient details</h1>
      <p class="page-subtitle">
        Review patient information and manage this patient record.
      </p>
    </div>

    <div class="header-actions">
      <a class="secondary-action" th:href="@{/patients}">Back to patients</a>
      <a class="primary-action" th:href="@{/patients/{id}/edit(id=${patient.id})}">
        Edit patient
      </a>
    </div>
  </section>

  <section class="content-panel detail-panel">
    <div class="detail-summary">
      <div class="patient-initial"
           th:text="${#strings.substring(patient.fullName, 0, 1)}">J</div>

      <div class="patient-meta">
        <p class="eyebrow">Patient Record</p>
        <h2 th:text="${patient.fullName}">John Silva</h2>
        <p class="detail-code" th:text="${patient.patientCode}">P001</p>
      </div>
    </div>

    <div class="detail-grid">
      <div class="detail-item">
        <span class="detail-label">Patient code</span>
        <span class="detail-value" th:text="${patient.patientCode}">P001</span>
      </div>

      <div class="detail-item">
        <span class="detail-label">Full name</span>
        <span class="detail-value" th:text="${patient.fullName}">John Silva</span>
      </div>

      <div class="detail-item">
        <span class="detail-label">Contact number</span>
        <span class="detail-value" th:text="${patient.contactNumber}">0771234567</span>
      </div>

      <div class="detail-item">
        <span class="detail-label">Address</span>
        <span class="detail-value" th:text="${patient.address}">540 Galle Road Colombo</span>
      </div>
    </div>

    <div class="detail-actions">
      <a class="secondary-action" th:href="@{/patients}">Back to patients</a>

      <a class="primary-action" th:href="@{/patients/{id}/edit(id=${patient.id})}">
        Edit patient
      </a>

      <form th:action="@{/patients/{id}/delete(id=${patient.id})}" method="post"
            onsubmit="return confirm('Are you sure you want to delete this patient?');">
        <button class="danger-action" type="submit">Delete patient</button>
      </form>
    </div>
  </section>

</main>
</body>
</html>
