<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Details | Sunrise Dental Clinic</title>
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="patient-page">

<main class="page-shell">

  <section class="page-header">
    <div>
      <p class="eyebrow">Patient Management</p>
      <h1>Patient details</h1>
      <p class="page-subtitle">
        Review patient information and manage this patient record.
      </p>
    </div>

    <div class="header-actions">
      <a class="secondary-action" th:href="@{/patients}">Back to patients</a>
      <a class="primary-action" th:href="@{/patients/{id}/edit(id=${patient.id})}">
        Edit patient
      </a>
    </div>
  </section>

  <section class="content-panel detail-panel">
    <div class="patient-profile">
      <div class="profile-avatar" aria-hidden="true"
           th:text="${#strings.substring(patient.fullName, 0, 1)}">
        P
      </div>

      <div>
        <p class="eyebrow">Patient record</p>
        <h2 th:text="${patient.fullName}">John Silva</h2>
        <p th:text="${patient.patientCode}">P001</p>
      </div>
    </div>

    <dl class="detail-grid">
      <div class="detail-item">
        <dt>Patient code</dt>
        <dd th:text="${patient.patientCode}">P001</dd>
      </div>

      <div class="detail-item">
        <dt>Full name</dt>
        <dd th:text="${patient.fullName}">John Silva</dd>
      </div>

      <div class="detail-item">
        <dt>Contact number</dt>
        <dd th:text="${patient.contactNumber}">0771234567</dd>
      </div>

      <div class="detail-item detail-item-wide">
        <dt>Address</dt>
        <dd th:text="${patient.address}">Colombo</dd>
      </div>
    </dl>

    <div class="detail-actions">
      <a class="secondary-action" th:href="@{/patients}">Back to patients</a>
      <a class="primary-action" th:href="@{/patients/{id}/edit(id=${patient.id})}">
        Edit patient
      </a>

      <form th:action="@{/patients/{id}/delete(id=${patient.id})}" method="post">
        <button class="danger-action" type="submit">Delete patient</button>
      </form>
    </div>
  </section>

</main>

</body>
</html>
